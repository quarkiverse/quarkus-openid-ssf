# The receiver under test as the automated tests run it. The plan tests add the certificate
# of the suite Testcontainers started and the push URL, see ConformanceSuiteResource.

# the port the suite reaches the receiver on; ConformanceSuiteResource sets the configured one
# (AbstractReceiverConformanceTest.receiverPort(), -Dcts.receiver.port)
quarkus.http.test-ssl-port=9444
# the TLS material of easyssf-test-conformance, on the class path
quarkus.tls.key-store.pem.receiver.cert=tls/receiver.pem
quarkus.tls.key-store.pem.receiver.key=tls/receiver-key.pem
# plain http on a random port for the test against the in-process transmitter
quarkus.http.insecure-requests=enabled
quarkus.http.test-port=0

# a trust store that exists without a running suite; the plan tests replace it
quarkus.tls.conformance-suite.trust-store.pem.certs=test-ca.pem
cts.transmitter.verify-hostname=true

# the nginx container of the suite logs every request, which only clutters the test output
quarkus.log.category."conformance.nginx".level=WARN
