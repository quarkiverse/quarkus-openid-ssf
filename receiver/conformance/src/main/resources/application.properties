# Receiver under test for the OpenID conformance suite running locally
# (https://localhost.emobix.co.uk:8443, see README.md). The automated tests override the
# TLS material, the port and the push URL, see src/test/resources/application.properties.

quarkus.application.name=easyssf-conformance-receiver
quarkus.console.color=false

# --- HTTPS only: the suite accepts no plain http push endpoint --------------
quarkus.http.ssl-port=9443
quarkus.http.insecure-requests=disabled
# created with mkcert, see README.md
quarkus.tls.key-store.pem.receiver.cert=${CTS_TLS_CERTIFICATE:certs/localhost.pem}
quarkus.tls.key-store.pem.receiver.key=${CTS_TLS_KEY:certs/localhost-key.pem}

# --- the suite's certificate --------------------------------------------------
# the self-signed certificate of the local conformance suite, see fetch-suite-certificate.sh
quarkus.tls.conformance-suite.trust-store.pem.certs=${CTS_SUITE_CERTIFICATE:certs/conformance-suite.pem}

# --- the receiver under test --------------------------------------------------
# the test instance of the suite, with the alias of its configuration
cts.transmitter.issuer=${CTS_TRANSMITTER_ISSUER:https://localhost.emobix.co.uk:8443/test/a/easyssf-receiver-quarkus-test}
cts.transmitter.tls-configuration-name=conformance-suite
# the certificate of the local suite is issued for 'localhost'
cts.transmitter.verify-hostname=false
# 'dynamic' (client credentials) or 'static' (access-token), as the test plan is configured
cts.auth.mode=${CTS_AUTH_MODE:dynamic}
cts.auth.client-id=${CTS_CLIENT_ID:easyssf-receiver}
cts.auth.client-secret=${CTS_CLIENT_SECRET:easyssf-receiver-secret}
cts.auth.scopes=ssf.read,ssf.manage
cts.auth.client-authentication-method=${CTS_CLIENT_AUTH:basic}
cts.auth.access-token=${CTS_ACCESS_TOKEN:}
# 'push' or 'poll', as the test plan is configured
cts.delivery.method=${CTS_DELIVERY:push}
cts.delivery.push-url=${CTS_PUSH_URL:https://localhost:9443/ssf/push}
cts.stream.events-requested=CaepSessionRevoked,CaepCredentialChange,CaepDeviceComplianceChange
cts.stream.subject-to-remove.format=email
cts.stream.subject-to-remove.email=foo@example.com
cts.run.idle-timeout=30s

quarkus.log.category."org.easyssf".level=DEBUG
