quarkus.http.port=8081
quarkus.console.color=false

# --- Keycloak issues the access tokens of the API ----------------------------
quarkus.oidc.auth-server-url=${KEYCLOAK_ISSUER:http://localhost:8080/realms/ssf-demo}
quarkus.oidc.client-id=example-resource-server
quarkus.oidc.application-type=service
# the examples always point at the Keycloak of examples/keycloak, never at a dev container
quarkus.keycloak.devservices.enabled=false

# authenticate only where a login or token is required: with proactive authentication,
# quarkus-oidc would take the 'Authorization: Bearer' header the transmitter sends to the
# push endpoint for an access token and reject the SET with 401
quarkus.http.auth.proactive=false
# the API needs an access token, everything else (push endpoint, /q/metrics) is open
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated

# --- SSF receiver ------------------------------------------------------------
# Keycloak is both the issuer of the access tokens and the SSF transmitter
quarkus.openid-ssf.receiver.transmitter-issuer=${quarkus.oidc.auth-server-url}
# the application registers its own PUSH stream on startup (the default), Keycloak assigns the audience
quarkus.openid-ssf.receiver.stream-management=RECEIVER
quarkus.openid-ssf.receiver.events-requested=CaepSessionRevoked
quarkus.openid-ssf.receiver.receiver-managed.description=example-resource-server
quarkus.openid-ssf.receiver.push.endpoint-path=/ssf/push
# how Keycloak (in Docker) reaches the push endpoint, must be allowed by 'ssf.validPushUrls' of the client
quarkus.openid-ssf.receiver.push.delivery-endpoint-url=${SSF_PUSH_URL:http://host.docker.internal:8081/ssf/push}
# the stream is created with this authorization header, Keycloak sends it with every SET
quarkus.openid-ssf.receiver.push.expected-auth-header=Bearer example-resource-server-push-secret
# the service account of the client manages the stream
quarkus.openid-ssf.receiver.oauth2.token-endpoint=${quarkus.oidc.auth-server-url}/protocol/openid-connect/token
quarkus.openid-ssf.receiver.oauth2.client-id=example-resource-server
quarkus.openid-ssf.receiver.oauth2.client-secret=${KEYCLOAK_CLIENT_SECRET:example-resource-server-secret}
quarkus.openid-ssf.receiver.oauth2.scopes=ssf.read,ssf.manage

quarkus.log.category."org.easyssf".level=DEBUG
quarkus.log.category."io.quarkiverse.ssf".level=DEBUG

# --- Profile 'poll' ----------------------------------------------------------
# Instead of registering a PUSH stream for its own client, the application uses the
# client 'example-poll-receiver', registers a POLL stream for it and polls Keycloak for
# events every two seconds:
#
#   mvn -pl receiver/examples/example-resource-server quarkus:dev -Dquarkus.profile=poll
%poll.quarkus.openid-ssf.receiver.delivery-method=POLL
%poll.quarkus.openid-ssf.receiver.receiver-managed.description=example-resource-server (poll)
%poll.quarkus.openid-ssf.receiver.poll.interval=2s
# the service account of the client 'example-poll-receiver' in Keycloak
%poll.quarkus.openid-ssf.receiver.oauth2.client-id=example-poll-receiver
%poll.quarkus.openid-ssf.receiver.oauth2.client-secret=${KEYCLOAK_POLL_CLIENT_SECRET:example-poll-receiver-secret}
