quarkus.http.port=8083
quarkus.console.color=false

# --- SSF receiver ------------------------------------------------------------
# The transmitter is the demo SCIM service provider the application starts itself
# (ExampleScimProvisioning): Keycloak does not emit SCIM Events. It sets
# quarkus.openid-ssf.receiver.transmitter-issuer to the address of the demo transmitter
# unless the property (or the QUARKUS_OPENID_SSF_RECEIVER_TRANSMITTER_ISSUER variable)
# is set. For a real SCIM service provider, set the issuer, the token (or oauth2.*) and
# the delivery method here.
quarkus.openid-ssf.receiver.transmitter-access-token=transmitter-access-token
quarkus.openid-ssf.receiver.delivery-method=POLL
quarkus.openid-ssf.receiver.poll.interval=2s
quarkus.openid-ssf.receiver.poll.start-delay=1s
# the application registers its own POLL stream on startup and asks for the SCIM Events it
# mirrors; the transmitter assigns the audience of the SETs (expected-audience stays unset)
quarkus.openid-ssf.receiver.stream-management=RECEIVER
quarkus.openid-ssf.receiver.events-requested=ScimFeedAdd,ScimFeedRemove,ScimProvCreateFull,ScimProvCreateNotice,ScimProvPatchFull,ScimProvPatchNotice,ScimProvPutFull,ScimProvPutNotice,ScimProvDelete,ScimProvActivate,ScimProvDeactivate
quarkus.openid-ssf.receiver.receiver-managed.description=example-scim-provisioning
# the demo transmitter is gone after a restart anyway
quarkus.openid-ssf.receiver.receiver-managed.delete-on-shutdown=true

quarkus.log.category."org.easyssf".level=INFO
quarkus.log.category."io.quarkiverse.ssf".level=INFO

# --- Demo ------------------------------------------------------------------
# The demo SCIM service provider tells the life of two users after the receiver registered
# its stream; off: the directory starts empty and /demo/scim waits for requests.
demo.autoplay=true
