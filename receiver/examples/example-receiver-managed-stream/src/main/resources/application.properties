quarkus.http.port=28080

# Omit null, empty fields from JSON responses (e.g. an absent `reason` on stream-status).
quarkus.jackson.serialization-inclusion=non-empty

# Don't spin up a Keycloak Dev Service container — quarkus-oidc-client is on
# the classpath for the `keycloak` profile, but we always point at a real
# transmitter, never a dev container.
quarkus.keycloak.devservices.enabled=false

quarkus.console.color=false

# --- SSF receiver extension --------------------------------------------------
#
# Scenarios are composed from two orthogonal profile axes via comma-separated
# activation (left-most wins):
#
#   -Dquarkus.profile=caepdev,push      caep.dev    + PUSH
#   -Dquarkus.profile=caepdev,poll      caep.dev    + POLL
#   -Dquarkus.profile=keycloak,push     Keycloak    + PUSH
#   -Dquarkus.profile=keycloak,poll     Keycloak    + POLL
#
# Transmitter overlay (caepdev|keycloak) supplies issuer + outbound auth.
# Delivery overlay (push|poll) supplies delivery-method + its push.* / poll.* keys.
# How calls to the transmitter are authenticated is decided at runtime: a static
# transmitter-access-token wins, then oauth2.token-endpoint, then the OIDC client
# of quarkus-oidc-client when the extension is present.

# Receiver-managed mode (the default): this app looks its stream up at the
# transmitter on startup and creates or updates it if necessary.
quarkus.openid-ssf.receiver.stream-management=RECEIVER

# Audience this receiver expects on inbound SETs. Leave it unset to accept the
# audience the transmitter assigned to the registered stream.
quarkus.openid-ssf.receiver.expected-audience=${SSF_RECEIVER_EXPECTED_AUDIENCE:https://my.expected.audience.com}

# Event types this receiver wants to subscribe to. Required when registering a
# stream — translates to events_requested on the create-stream request. Each
# entry can be a full URI or a built-in / configured alias (CaepSessionRevoked,
# RiscAccountDisabled, …); unknown aliases fail fast at startup with a list of
# the registered names.
quarkus.openid-ssf.receiver.events-requested=CaepSessionRevoked,CaepCredentialChange,RiscAccountEnabled,RiscAccountDisabled,RiscAccountPurged

# Whether the stream is deleted at the transmitter when this app stops. Off, so
# a restart finds and reuses the stream.
quarkus.openid-ssf.receiver.receiver-managed.delete-on-shutdown=false
quarkus.openid-ssf.receiver.receiver-managed.description=quarkus-openid-ssf-receiver example
