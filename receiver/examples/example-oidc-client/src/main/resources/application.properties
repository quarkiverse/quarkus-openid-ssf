quarkus.http.port=8082
quarkus.console.color=false

# --- Login with Keycloak -----------------------------------------------------
quarkus.oidc.auth-server-url=${KEYCLOAK_ISSUER:http://localhost:8080/realms/ssf-demo}
quarkus.oidc.client-id=example-oidc-client
quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET:example-oidc-client-secret}
quarkus.oidc.application-type=web-app
quarkus.oidc.authentication.scopes=profile,email
# logging out of the application also logs the user out of Keycloak (RP-initiated logout)
quarkus.oidc.logout.path=/logout
quarkus.oidc.logout.post-logout-path=/
# the examples always point at the Keycloak of examples/keycloak, never at a dev container
quarkus.keycloak.devservices.enabled=false

# authenticate only where a login or token is required: with proactive authentication,
# quarkus-oidc would take the 'Authorization: Bearer' header the transmitter sends to the
# push endpoint for an access token and reject the SET with 401
quarkus.http.auth.proactive=false
# every page needs a login; the push endpoint and the Quarkus endpoints (/q/*) are open
quarkus.http.auth.permission.pages.paths=/*
quarkus.http.auth.permission.pages.policy=authenticated
quarkus.http.auth.permission.open.paths=/ssf/push,/q/*
quarkus.http.auth.permission.open.policy=permit

# --- SSF receiver ------------------------------------------------------------
# Keycloak is both the identity provider and the SSF transmitter
quarkus.openid-ssf.receiver.transmitter-issuer=${quarkus.oidc.auth-server-url}
# the application registers its own PUSH stream on startup (the default), Keycloak assigns the audience
quarkus.openid-ssf.receiver.stream-management=RECEIVER
quarkus.openid-ssf.receiver.events-requested=CaepSessionRevoked,CaepCredentialChange
quarkus.openid-ssf.receiver.receiver-managed.description=example-oidc-client
quarkus.openid-ssf.receiver.push.endpoint-path=/ssf/push
# how Keycloak (in Docker) reaches the push endpoint, must be allowed by 'ssf.validPushUrls' of the client
quarkus.openid-ssf.receiver.push.delivery-endpoint-url=${SSF_PUSH_URL:http://host.docker.internal:8082/ssf/push}
# the stream is created with this authorization header, Keycloak sends it with every SET
quarkus.openid-ssf.receiver.push.expected-auth-header=Bearer example-oidc-client-push-secret
# the service account of the client manages the stream
quarkus.openid-ssf.receiver.oauth2.token-endpoint=${quarkus.oidc.auth-server-url}/protocol/openid-connect/token
quarkus.openid-ssf.receiver.oauth2.client-id=${quarkus.oidc.client-id}
quarkus.openid-ssf.receiver.oauth2.client-secret=${quarkus.oidc.credentials.secret}
quarkus.openid-ssf.receiver.oauth2.scopes=ssf.read,ssf.manage

quarkus.log.category."org.easyssf".level=DEBUG
quarkus.log.category."io.quarkiverse.ssf".level=DEBUG
