name: Native build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - '**.txt'
      - 'LICENSE'
      - 'design/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - '**.txt'
      - 'LICENSE'
      - 'design/**'
  schedule:
    # Weekly run catches drift when transitive Quarkus / Mandrel releases
    # change native compatibility under our feet.
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-native:
    name: Native · ${{ matrix.example }}
    strategy:
      fail-fast: false
      matrix:
        # Native builds are slow (~5-10 min each). The resource server, the
        # receiver-managed and the SCIM provisioning example run their integration
        # tests against the native binary (easyssf's TestTransmitter stands in for the transmitter),
        # which is where the JSON support shaded in Nimbus and the virtual threads
        # of easyssf get exercised under GraalVM.
        example:
          - example-resource-server
          - example-oidc-client
          - example-transmitter-managed-stream
          - example-receiver-managed-stream
          - example-scim-provisioning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: 'maven'

      # Install the extension and its parent poms first (-am) so the example build can resolve them locally.
      - name: Install extension
        run: mvn -B -DskipTests -Dno-format -pl receiver/runtime,receiver/deployment -am install

      - name: Native build and integration tests
        run: |
          mvn -B -Dno-format \
            -pl receiver/examples/${{ matrix.example }} \
            -Pnative \
            -Dquarkus.native.container-build \
            verify

      - name: Inspect native binary
        run: |
          BIN=$(find receiver/examples/${{ matrix.example }}/target -maxdepth 2 -type f -perm -u+x ! -name "*.jar" ! -name "*.so" | head -n1)
          if [ -z "$BIN" ]; then
            echo "::error::No native binary produced under receiver/examples/${{ matrix.example }}/target/"
            exit 1
          fi
          echo "Native binary: $BIN"
          ls -lh "$BIN"
          file "$BIN"
